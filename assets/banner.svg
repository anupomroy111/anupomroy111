<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="850" height="250">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>

    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="50" result="blur"/>
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.03"/>
      <circle cx="0" cy="0" r="1" fill="#38bdf8" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 40px; letter-spacing: -0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 15px; fill: #94a3b8; letter-spacing: 0.3px; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 0.8px; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 12px; fill: #e2e8f0; }
  </style>

  <!-- Base Card -->
  <rect x="2" y="2" width="846" height="246" rx="16" fill="url(#bgGradient)"/>

  <!-- Ambient Glow Effects -->
  <circle cx="100" cy="50" r="100" fill="#0284c7" filter="url(#glowCyan)" opacity="0.35"/>
  <circle cx="750" cy="200" r="110" fill="#7c3aed" filter="url(#glowPurple)" opacity="0.3"/>

  <!-- Subtle Grid Texture -->
  <rect x="2" y="2" width="846" height="246" rx="16" fill="url(#grid)"/>

  <!-- Modern Border Stroke -->
  <rect x="2" y="2" width="846" height="246" rx="16" fill="none" stroke="url(#borderGradient)" stroke-width="1.5"/>

  <!-- Status Badge (Top-Left) -->
  <g transform="translate(42, 34)">
    <rect width="270" height="26" rx="13" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
    <circle cx="15" cy="13" r="4.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="17" fill="#10b981" class="badge-text">OPEN FOR WORK &amp; COLLABORATION</text>
  </g>

  <!-- Name & Branding -->
  <text x="42" y="112" fill="url(#titleGradient)" class="title">Anupom Roy</text>

  <!-- Subtitle / Tagline -->
  <text x="44" y="142" class="subtitle">Software Developer • Flutter &amp; Dart Specialist • Python &amp; FastAPI Architect</text>

  <!-- Divider Line -->
  <line x1="44" y1="162" x2="806" y2="162" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.6"/>

  <!-- Bottom Interactive-style Feature Pills -->
  <g transform="translate(44, 182)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="175" height="34" rx="8" fill="url(#pillGrad1)" stroke="#0284c7" stroke-width="1" stroke-opacity="0.4"/>
      <text x="14" y="22" class="pill-text">📱 Flutter &amp; Dart</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(190, 0)">
      <rect width="180" height="34" rx="8" fill="url(#pillGrad1)" stroke="#0284c7" stroke-width="1" stroke-opacity="0.4"/>
      <text x="14" y="22" class="pill-text">⚙️ FastAPI &amp; Backend</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(385, 0)">
      <rect width="185" height="34" rx="8" fill="url(#pillGrad1)" stroke="#0284c7" stroke-width="1" stroke-opacity="0.4"/>
      <text x="14" y="22" class="pill-text">🤖 Voice &amp; AI Integration</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(585, 0)">
      <rect width="175" height="34" rx="8" fill="url(#pillGrad1)" stroke="#0284c7" stroke-width="1" stroke-opacity="0.4"/>
      <text x="14" y="22" class="pill-text">🚀 Scalable Architecture</text>
    </g>
  </g>
</svg>
